<body class="bg-dark text-light">

<header class="container-fluid py-4 text-center border-bottom border-secondary">
  <h1 class="logo">GLAM<span>BEAUTY</span></h1>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
  <div class="container">
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="ofertas.html">Ofertas</a></li>

        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        <li class="nav-item"><a class="nav-link" href="tendencias.html">Tendencias</a></li>
      </ul>

      <button class="btn btn-outline-warning ms-3" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        🛒 <span id="countCarrito" class="badge bg-warning text-dark">0</span>
      </button>
    </div>
  </div>
</nav>

<section class="container mt-5">

  <h2 class="section-title">Contáctanos</h2>

  <form class="mt-4">
    <div class="mb-3">
      <label class="form-label">Nombre Completo</label>
      <input type="text" class="form-control bg-black text-light border-secondary">
    </div>

    <div class="mb-3">
      <label class="form-label">Correo Electrónico</label>
      <input type="email" class="form-control bg-black text-light border-secondary">
    </div>

    <div class="mb-3">
      <label class="form-label">Mensaje</label>
      <textarea class="form-control bg-black text-light border-secondary" rows="5"></textarea>
    </div>

    <button class="btn btn-warning">Enviar Mensaje</button>
  </form>

</section>

<footer class="text-center py-4 border-top border-secondary mt-5">
  <p>© 2025 GlamBeauty — Belleza que ilumina la oscuridad</p>
    </div>
</footer>

<!-- Modal Carrito -->
<div class="modal fade" id="modalCarrito">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Carrito de Compras</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul id="listaCarrito" class="list-group"></ul>
        <h5 class="mt-3">Total: <span id="totalCarrito">0</span> COP</h5>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
        <button class="btn btn-warning">Comprar</button>
      </div>
    </div>
  </div>
</div>
