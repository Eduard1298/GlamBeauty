<section class="container mt-5">
  <h2 class="section-title">Ofertas Exclusivas</h2>

  <div class="row mt-5">

    <div class="col-md-4 mb-4">
      <div class="card product-card">
        <img src="img/base.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Base HD Pro</h5>
          <p class="text-secondary"><del>52.000</del> <span class="text-warning">42.000 COP</span></p>

        </div>
      </div>
    </div>

    <div class="col-md-4 mb-4">
      <div class="card product-card">
        <img src="img/labial.jpg" class="card-img-top">

          <p class="text-secondary"><del>39.000</del> <span class="text-warning">29.000 COP</span></p>

<!-- Modal Carrito -->
<div class="modal fade" id="modalCarrito">

        <ul id="listaCarrito" class="list-group"></ul>
        <h5 class="mt-3">Total: <span id="totalCarrito">0</span> COP</h5>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
        <button class="btn btn-warning">Comprar</button>
      </div>
    </div>
  </div>
</div>
